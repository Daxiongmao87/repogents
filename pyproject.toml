[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repogents"
version = "0.1.0"
description = "Local restart-safe repository agent orchestrator"
requires-python = ">=3.10"
dependencies = ["mini-swe-agent==2.4.5"]

[project.scripts]
repogents = "repogents.cli:main"

[tool.setuptools.packages.find]
include = ["repogents*"]

[tool.coverage.run]
branch = true
source = ["repogents"]
